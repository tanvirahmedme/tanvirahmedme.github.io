    "Research Projects":
      - name: Wearable Smart Collar for Cattle Behavior Prediction
        summary: >-
          USDA-NIFA funded. Custom-designed wearable collar (PCB, firmware, 3D-printed
          enclosure) that classifies cattle behavior from IMU and GNSS data. Deployed
          on cattle at Freeman Ranch; best model (Random Forest + FFT + SMOTE) reached
          86.2% accuracy, served live via a FastAPI dashboard.
        highlights:
          - "End-to-end: schematic & PCB design, embedded firmware, enclosure, ML pipeline, and deployment"
        start_date: 2023-08
        end_date: now

      - name: Autonomous Animal Care Robot (AnimalCareBot)
        summary: >-
          USDA-NIFA funded. Passive self-righting robot design and autonomous
          navigation/control using SLAM for cattle management at Freeman Ranch.
        highlights:
          - "Self-righting mechanical design and SLAM-based autonomous navigation"
        start_date: 2024-01
        end_date: now

      - name: Human Motion Gait Analysis Using IMU Sensors
        summary: >-
          USDA-NIFA funded. IMU sensor fusion and activity-recognition algorithms to
          model human movement patterns for health-monitoring applications.
        highlights:
          - "Published at IEEE CYBER 2024"
        start_date: 2023-08
        end_date: 2024-07

